<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pedido listo')}"></head>
<body>
<svg th:replace="~{fragments/layout :: iconos}"></svg>
<header th:replace="~{fragments/layout :: header(${activo})}"></header>
<main class="wrap">
    <section class="panel confirmacion">
        <ol class="pasos">
            <li class="paso hecho"><b><svg class="ic ic-sm"><use href="#i-check"/></svg></b><span>Envío</span></li>
            <li class="paso hecho"><b><svg class="ic ic-sm"><use href="#i-check"/></svg></b><span>Pago</span></li>
            <li class="paso activo"><b>3</b><span>Confirmación</span></li>
        </ol>
        <svg class="ic ic-xl rosa"><use href="#i-whatsapp"/></svg>
        <h1>¡Tu pedido está casi listo!</h1>
        <p>Para terminar, envía el mensaje por WhatsApp. Te confirmaremos el pago y el envío por ahí.</p>
        <p class="rosa total-conf" th:text="'Total: S/ ' + ${#numbers.formatDecimal(totalPedido,1,2,'POINT')}">Total</p>
        <a th:href="${waUrl}" class="btn-primary btn-wa" id="btn-wa" target="_blank" rel="noopener"><svg class="ic"><use href="#i-whatsapp"/></svg> Abrir WhatsApp <svg class="ic ic-sm"><use href="#i-arrow-right"/></svg></a>
        <p><a th:href="@{/catalogo}" class="link-suave">Seguir comprando</a></p>
        <p class="script gracias">Gracias por ser parte de Grace</p>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<div class="toast" id="toast" role="status"></div>
<script th:src="@{/js/grace.js}"></script>
</body>
</html>
